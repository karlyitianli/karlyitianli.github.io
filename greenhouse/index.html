<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Greenhouse — Karl Li</title>
<meta name="description" content="Greenhouse case study, coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  @font-face { font-family: "Inter"; src: url("https://framerusercontent.com/assets/GrgcKwrN6d3Uz8EwcLHZxwEfC4.woff2") format("woff2"); font-display: swap; font-style: normal; font-weight: 400; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2070, U+2074-207E, U+2080-208E, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; src: url("https://framerusercontent.com/assets/UjlFhCnUjxhNfep4oYBPqnEssyo.woff2") format("woff2"); font-display: swap; font-style: normal; font-weight: 500; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2070, U+2074-207E, U+2080-208E, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; src: url("https://framerusercontent.com/assets/yDtI2UI8XcEg1W2je9XPN3Noo.woff2") format("woff2"); font-display: swap; font-style: normal; font-weight: 600; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2070, U+2074-207E, U+2080-208E, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    --surface: #fcfcfc;
    --tan: #f9f3e6;
    --beige: #f5f2eb;
    --ink: #292929;
    --muted: #7e7e7e;
    --border: rgba(18, 18, 18, 0.07);
    --gold: #b58900;
    --gold-hover: #806000;
    --white: #ffffff;
    --icon-grey: #707070;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-feature-settings: "cv03" 1, "cv04" 1, "cv09" 1, "cv11" 1, "blwf" 1;
    background-color: var(--surface);
    background-image: url("/grid.svg");
    background-size: 15px 15px;
    background-repeat: repeat;
    color: var(--ink);
    font-size: 14px;
    line-height: 20px;
    letter-spacing: -0.1px;
  }
  a { color: inherit; }
  p { margin: 0; }
  .page { padding: 16px 40px 40px; }
  .content { max-width: 1280px; margin: 0 auto; display: flex; align-items: flex-start; gap: 16px; padding-top: 24px; }
  .panel { background: var(--white); border: 1px solid var(--border); border-radius: 8px; }
  .left { width: 128px; flex: none; padding: 12px; position: sticky; top: 24px; z-index: 1; }
  .nav { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  .nav-links { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--white); border-radius: 999px; padding: 6px 12px;
    font-size: 14px; line-height: 20px; letter-spacing: -0.1px; color: var(--muted);
    text-decoration: none; white-space: nowrap;
  }
  .pill:hover { background: var(--border); color: var(--ink); }
  .pill .ph { font-size: 16px; color: var(--icon-grey); }
  .main { flex: 1; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
  .right { width: 256px; flex: none; padding: 24px; }
  h1 { font-size: 24px; line-height: 32px; letter-spacing: -0.8px; font-weight: 400; margin: 0; }
  .intro { color: var(--muted); }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .hero { width: 100%; height: auto; aspect-ratio: 2160 / 1350; object-fit: cover; border-radius: 16px; display: block; }
  section { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 24px; }
  section h2 {
    font-family: "DM Mono", monospace; font-size: 12px; line-height: 16px;
    letter-spacing: 0.24px; color: var(--gold); text-transform: uppercase; font-weight: 400; margin: 0;
  }
  ol { margin: 0; padding-left: 20px; }
  li { margin-bottom: 0; }
  li::marker { color: var(--muted); }
  .details { display: flex; flex-direction: column; gap: 16px; }
  .logo { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; border: 1px solid var(--border); background: #fff; display: block; }
  .project-info { display: flex; flex-direction: column; gap: 2px; }
  .project-info .sub { color: var(--muted); }
  .detail { display: flex; flex-direction: column; gap: 4px; }
  .detail .label {
    font-family: "DM Mono", monospace; font-size: 12px; line-height: 20px;
    letter-spacing: 0; color: var(--gold); text-transform: uppercase;
  }
  @media (max-width: 1023.98px) {
    .page { padding: 16px; }
    .content { flex-direction: column; padding-top: 0; }
    .left { width: 100%; position: static; }
    .nav { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; }
    .nav-links { flex-direction: row; flex-wrap: wrap; }
    .right { display: none; }
  }
  @media (max-width: 767.98px) {
    .page { padding: 8px; }
    h1 { font-size: 16px; line-height: 24px; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="content">
    <aside class="panel left">
      <nav class="nav" aria-label="Case study sections">
        <a class="pill" href="/"><i class="ph ph-arrow-left"></i>Back</a>
        <a class="pill" href="/level">Next<i class="ph ph-arrow-right"></i></a>
      </nav>
    </aside>

    <article class="panel main">
    </article>

    <aside class="panel right">
    </aside>
  </div>
</main>
</body>
</html>
