<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Attentive — Karl Li</title>
<meta name="description" content="Attentive case study, coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  @font-face { font-family: "Inter"; src: url("https://framerusercontent.com/assets/GrgcKwrN6d3Uz8EwcLHZxwEfC4.woff2") format("woff2"); font-display: swap; font-style: normal; font-weight: 400; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2070, U+2074-207E, U+2080-208E, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    --surface: #fcfcfc;
    --ink: #292929;
    --muted: #7e7e7e;
    --border: rgba(18, 18, 18, 0.07);
    --white: #ffffff;
    --icon-grey: #707070;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-feature-settings: "cv03" 1, "cv04" 1, "cv09" 1, "cv11" 1, "blwf" 1;
    background-color: var(--surface);
    background-image: url("/grid.svg");
    background-size: 15px 15px;
    background-repeat: repeat;
    color: var(--ink);
    font-size: 14px;
    line-height: 20px;
    letter-spacing: -0.1px;
  }
  a { color: inherit; }
  p { margin: 0; }
  .page { max-width: 960px; margin: 0 auto; padding: 24px; }
  .panel { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 24px; line-height: 32px; letter-spacing: -0.8px; font-weight: 400; margin: 0; }
  .sub { color: var(--muted); }
  .back { display: inline-flex; align-items: center; gap: 8px; background: var(--white); border-radius: 999px; padding: 6px 12px; color: var(--muted); text-decoration: none; width: max-content; }
  .back:hover { color: var(--ink); }
  .back .ph { font-size: 16px; color: var(--icon-grey); }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="./"><i class="ph ph-arrow-left"></i>Back</a>
  <div class="panel" style="margin-top: 16px;">
    <h1>Attentive</h1>
    <p class="sub">Coming soon.</p>
  </div>
</main>
</body>
</html>
