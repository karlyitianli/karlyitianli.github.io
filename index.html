<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello world, Karl Li</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f6f1e7;
    color: #1c1c1c;
    transition: background 0.3s ease;
  }
  main {
    max-width: 560px;
    width: 100%;
    background: #fff;
    border: 1px solid #e3ddd0;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  }
  .eyebrow {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6b6257;
  }
  h1 { margin: 0 0 12px; font-size: 40px; line-height: 1.1; }
  p { margin: 0 0 16px; font-size: 17px; line-height: 1.6; }
  button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 700;
    background: #1c1c1c;
    color: #fff;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #2f6fed; outline-offset: 3px; }
  #count { margin: 16px 0 0; font-size: 15px; color: #555; }
  .small { margin: 24px 0 0; font-size: 13px; color: #777; }
  .small a { color: inherit; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Hello world</p>
  <h1>Hi, I am Karl Li.</h1>
  <p>Product designer in Vancouver, BC. This page is live on GitHub Pages, built with Muse over WhatsApp.</p>
  <button id="colorBtn" type="button">Change the colour</button>
  <p id="count">You have tapped 0 times.</p>
  <p class="small">Repo: <a href="https://github.com/karlyitianli/karlyitianli.github.io">karlyitianli/karlyitianli.github.io</a></p>
</main>
<script>
  const colors = ["#f6f1e7", "#dcefe3", "#dbeafe", "#fde8d8", "#f3e8ff", "#fef3c7"];
  const labels = ["warm paper", "mint", "sky", "peach", "lilac", "butter"];
  let taps = 0;
  let index = 0;
  const button = document.getElementById("colorBtn");
  const count = document.getElementById("count");
  button.addEventListener("click", () => {
    taps += 1;
    index = (index + 1) % colors.length;
    document.body.style.background = colors[index];
    count.textContent = "You have tapped " + taps + (taps === 1 ? " time." : " times.") + " Background: " + labels[index] + ".";
  });
</script>
</body>
</html>
